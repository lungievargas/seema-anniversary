<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebrating 32 Years</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #071d38;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 1100px;
        }

        .programme-card {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .programme-card {
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <main class="card-container">
        <img
            src="/seema32-program.png"
            alt="Celebrating 32 Years of Holy Matrimony Programme"
            class="programme-card"
        >
    </main>

</body>
</html>
